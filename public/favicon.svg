<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Trust Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122543" />
      <stop offset="100%" stop-color="#07111e" />
    </linearGradient>

    <!-- Accent Light Blue -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="8" />

  <!-- Inner Body -->
  <rect x="52" y="52" width="408" height="408" rx="96" fill="url(#shieldGrad)" stroke="#1e40af" stroke-width="4" />

  <!-- Bold Clean 'E' Emblem -->
  <!-- Spine -->
  <rect x="156" y="136" width="56" height="240" rx="28" fill="url(#blueAccent)" />
  
  <!-- Top Bar -->
  <rect x="156" y="136" width="200" height="52" rx="26" fill="url(#blueAccent)" />
  
  <!-- Middle Bar -->
  <rect x="156" y="230" width="150" height="52" rx="26" fill="url(#blueAccent)" />
  
  <!-- Bottom Bar -->
  <rect x="156" y="324" width="200" height="52" rx="26" fill="url(#blueAccent)" />

  <!-- Trust Star Accent -->
  <path d="M370 136 L376 156 L396 162 L376 168 L370 188 L364 168 L344 162 L364 156 Z" fill="#93c5fd" />
</svg>
